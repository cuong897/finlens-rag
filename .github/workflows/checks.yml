name: FinLens checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: node --check finlens/static/app.js
      - run: python -m finlens evaluate
      - uses: actions/upload-artifact@v6
        with:
          name: smoke-evaluation-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/evaluation.*
