[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finlens"
version = "0.1.0"
description = "Vietnamese financial document evidence and comparison assistant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pymupdf>=1.24.4,<2", "pydantic>=2.8,<3"]

[project.scripts]
finlens = "finlens.cli:main"

[tool.setuptools.packages.find]
include = ["finlens*"]

[tool.setuptools.package-data]
finlens = ["static/*", "fixtures/*.json"]
